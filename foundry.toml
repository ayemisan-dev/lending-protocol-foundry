[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.34"

optimizer = true
optimizer_runs = 200

auto_detect_remappings = false
via_ir = true

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 100

[fmt]
line_length = 120
tab_width = 4
style = "space"
bracket_spacing = false
int_types = "long"
quote_style = "double"
